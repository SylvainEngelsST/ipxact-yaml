schema_version: 1
naming_profile: rds-v1
kind: system
vlnv:
  vendor: example.org
  library: subsystems
  name: event_cluster
  version: "1.0"
address_spaces:
  - name: apb
    address_width_bits: 16
    data_width_bits: 32
    size_bytes: 65536
    instances:
      - name: EVENT0
        source: ip.yaml
        mappings:
          - target: csr
            base: 0x1000
            size_bytes: 4096
          - target: scratch
            base: 0x2000
            size_bytes: 256
          - target: hole
            base: 0x2100
            size_bytes: 256
      - name: EVENT1
        source: ip.yaml
        mappings:
          - target: csr
            base: 0x3000
            size_bytes: 4096
